{% extends "base.html" %}

{% block title %}DineMind - {{ error_code }} Error{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-7 text-center">
        <div class="card border-0 shadow-sm p-5">
            <div class="display-1 text-danger fw-bold mb-3">{{ error_code }}</div>
            <h3 class="fw-bold mb-3">{{ error_title }}</h3>
            <p class="text-muted mb-4">{{ error_message }}</p>
            <div>
                <a href="{{ url_for('index') }}" class="btn btn-danger px-4">
                    <i class="bi bi-house-door me-1"></i> Return to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
